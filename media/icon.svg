<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 深黑科技感容器背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c12" />
      <stop offset="100%" stop-color="#040507" />
    </linearGradient>

    <!-- 容器微光边缘 -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- 柔和外发光滤镜 -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 层级 1 渐变 (顶层：宏观架构/工程层 - 电光青蓝) -->
    <linearGradient id="topPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- 层级 2 渐变 (中间层：模块与契约层 - 极客靛蓝) -->
    <linearGradient id="midPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- 层级 3 渐变 (底层：拓扑流转与代码调用层 - 幻彩紫罗兰) -->
    <linearGradient id="botPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <!-- 纵向穿透调用链光束 (贯穿三层的架构主轴) -->
    <linearGradient id="coreBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- 侧翼反光渐变 -->
    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- 1. 背景圆角矩形 -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- 2. 环境背光 (Cyan-Purple 弥散光晕) -->
  <circle cx="256" cy="256" r="120" fill="#0284c7" opacity="0.18" filter="url(#coreGlow)" />
  <circle cx="256" cy="270" r="100" fill="#6366f1" opacity="0.14" filter="url(#coreGlow)" />

  <!-- 3. 三维等距架构分层 (Isometric Architecture Layers) -->
  <!-- 中心轴线：X=256。三层菱形平板层叠悬浮，展现纯正的代码架构与图谱拓扑 -->
  <g id="architecture-stack">

    <!-- 底层菱形 (Layer 3: 调用图与数据流基座) -->
    <!-- 顶角(256, 280), 右角(390, 335), 底角(256, 390), 左角(122, 335) -->
    <g transform="translate(0, 30)">
      <!-- 投影 -->
      <polygon points="256,290 390,345 256,400 122,345" fill="#000000" opacity="0.5" filter="url(#neonGlow)" />
      <!-- 厚度侧边 -->
      <polygon points="122,335 256,390 256,406 122,351" fill="#581c87" opacity="0.9" />
      <polygon points="390,335 256,390 256,406 390,351" fill="#3b0764" opacity="0.9" />
      <!-- 主表面 -->
      <polygon points="256,280 390,335 256,390 122,335" fill="url(#botPlate)" opacity="0.92" stroke="#e9d5ff" stroke-width="1.5" stroke-opacity="0.4" />
      <!-- 表面高光棱线 -->
      <line x1="256" y1="280" x2="390" y2="335" stroke="url(#edgeGlow)" stroke-width="2" opacity="0.7" />
    </g>

    <!-- 中层菱形 (Layer 2: 模块与符号契约层) -->
    <!-- 顶角(256, 195), 右角(390, 250), 底角(256, 305), 左角(122, 250) -->
    <g transform="translate(0, 0)">
      <!-- 投影 -->
      <polygon points="256,205 390,260 256,315 122,260" fill="#000000" opacity="0.4" filter="url(#neonGlow)" />
      <!-- 厚度侧边 -->
      <polygon points="122,250 256,305 256,319 122,264" fill="#3730a3" opacity="0.9" />
      <polygon points="390,250 256,305 256,319 390,264" fill="#1e1b4b" opacity="0.9" />
      <!-- 主表面 -->
      <polygon points="256,195 390,250 256,305 122,250" fill="url(#midPlate)" opacity="0.92" stroke="#c7d2fe" stroke-width="1.5" stroke-opacity="0.4" />
      <!-- 表面高光棱线 -->
      <line x1="256" y1="195" x2="390" y2="250" stroke="url(#edgeGlow)" stroke-width="2" opacity="0.7" />
    </g>

    <!-- 顶层菱形 (Layer 1: 宏观架构与全景大纲) -->
    <!-- 顶角(256, 110), 右角(390, 165), 底角(256, 220), 左角(122, 165) -->
    <g transform="translate(0, -30)">
      <!-- 厚度侧边 -->
      <polygon points="122,165 256,220 256,234 122,179" fill="#0369a1" opacity="0.9" />
      <polygon points="390,165 256,220 256,234 390,179" fill="#082f49" opacity="0.9" />
      <!-- 主表面 -->
      <polygon points="256,110 390,165 256,220 122,165" fill="url(#topPlate)" opacity="0.95" stroke="#bae6fd" stroke-width="1.5" stroke-opacity="0.6" />
      <!-- 表面高光棱线 -->
      <line x1="256" y1="110" x2="390" y2="165" stroke="url(#edgeGlow)" stroke-width="2.5" opacity="0.9" />
    </g>

    <!-- 4. 纵向贯穿三层的架构核心连通光柱 (Static Call Flow Spine) -->
    <!-- 穿过顶层、中层、底层的核心光柱，象征着调用链路贯穿整个工程 -->
    <g filter="url(#neonGlow)">
      <!-- 垂直轴线 -->
      <line x1="256" y1="75" x2="256" y2="425" stroke="url(#coreBeam)" stroke-width="5" stroke-linecap="round" />
      
      <!-- 顶端发光原点 (Root Entry) -->
      <circle cx="256" cy="75" r="10" fill="#ffffff" />
      <circle cx="256" cy="75" r="5" fill="#38bdf8" />

      <!-- 中间焦点 (Ego Center) -->
      <circle cx="256" cy="250" r="8" fill="#ffffff" />

      <!-- 底端焦点 (Terminal Sink) -->
      <circle cx="256" cy="425" r="10" fill="#ffffff" />
      <circle cx="256" cy="425" r="5" fill="#c084fc" />
    </g>

    <!-- 5. 顶层平台上的几何拓扑节点网格 (极简科技美学) -->
    <g transform="translate(0, -30)">
      <!-- 平台内部微缩有向调用拓扑网 -->
      <line x1="256" y1="135" x2="190" y2="165" stroke="#ffffff" stroke-width="2" opacity="0.8" />
      <line x1="256" y1="135" x2="322" y2="165" stroke="#ffffff" stroke-width="2" opacity="0.8" />
      <line x1="190" y1="165" x2="256" y2="195" stroke="#ffffff" stroke-width="2" opacity="0.8" />
      <line x1="322" y1="165" x2="256" y2="195" stroke="#ffffff" stroke-width="2" opacity="0.8" />
      <line x1="190" y1="165" x2="322" y2="165" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />

      <circle cx="256" cy="135" r="6" fill="#ffffff" />
      <circle cx="190" cy="165" r="5" fill="#ffffff" />
      <circle cx="322" cy="165" r="5" fill="#ffffff" />
      <circle cx="256" cy="195" r="6" fill="#ffffff" />
    </g>

  </g>
</svg>
